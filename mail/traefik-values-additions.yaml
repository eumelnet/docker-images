# In bestehende traefik-helm-chart/values.yaml einfügen:

securityContext:
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

ports:
  # bestehende Ports (web, websecure, traefik) bleiben erhalten!
  smtp:
    port: 25
    protocol: TCP
    expose: true
  submission:
    port: 587
    protocol: TCP
    expose: true
  imap:
    port: 143
    protocol: TCP
    expose: true
  imaps:
    port: 993
    protocol: TCP
    expose: true
  pop3:
    port: 110
    protocol: TCP
    expose: true
  pop3s:
    port: 995
    protocol: TCP
    expose: true
